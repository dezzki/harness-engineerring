<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Study dashboard for tracking GitHub repositories you study from.">
  <title>StudyDash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-name">StudyDash</h1>
    <p class="app-tagline">Your study repos, in one place</p>
  </header>

  <main class="container">
    <section class="card connect-section" aria-labelledby="connect-title">
      <h2 id="connect-title" class="section-title">Connect a repository</h2>
      <form id="connect-form" class="connect-form" novalidate>
        <label class="visually-hidden" for="repo-input">GitHub repository (owner/repo)</label>
        <input
          type="text"
          id="repo-input"
          class="connect-input"
          placeholder="owner/repo — e.g. facebook/react"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" id="connect-btn" class="connect-btn">Connect</button>
      </form>
      <p id="connect-warning" class="connect-warning" role="alert" hidden>
        Please enter a repository in owner/repo format first.
      </p>
      <p id="connect-status" class="connect-status" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="connect-status-text"></span>
      </p>
    </section>

    <section id="empty-state" class="card empty-state" aria-labelledby="empty-title">
      <div class="empty-state-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <h2 id="empty-title">Nothing here yet</h2>
      <p>
        Connect your first GitHub repository above and its study details
        will show up right here.
      </p>
    </section>

    <section id="repo-card" class="card repo-card" aria-labelledby="repo-name" hidden>
      <div class="repo-card-header">
        <h2 id="repo-name" class="repo-name">
          <a id="repo-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </h2>
        <span id="repo-language" class="language-badge" hidden></span>
      </div>
      <p id="repo-description" class="repo-description"></p>
      <dl class="repo-stats">
        <div class="stat">
          <dt>Stars</dt>
          <dd id="repo-stars"></dd>
        </div>
        <div class="stat">
          <dt>Forks</dt>
          <dd id="repo-forks"></dd>
        </div>
        <div class="stat">
          <dt>Open issues</dt>
          <dd id="repo-issues"></dd>
        </div>
      </dl>
      <p class="repo-meta">Last commit: <strong id="repo-last-commit"></strong></p>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
